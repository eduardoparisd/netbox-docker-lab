services:
  netbox:
    volumes:
      - ./data/media:/opt/netbox/netbox/media:rw
      - ./data/reports:/opt/netbox/netbox/reports:rw
      - ./data/scripts:/opt/netbox/netbox/scripts:rw

  postgres:
    volumes:
      - ./data/postgres:/var/lib/postgresql

  redis:
    command:
      - sh
      - -c
      - valkey-server --appendonly yes --requirepass $$REDIS_PASSWORD --save ""
    volumes:
      - ./data/redis:/data

  redis-cache:
    command:
      - sh
      - -c
      - valkey-server --requirepass $$REDIS_PASSWORD --save ""
    volumes:
      - ./data/redis-cache:/data
